[package]
name = "quick-note"
version = "0.8.0"
description = "Quick Note - 轻量 Markdown 笔记软件"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quick_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 定时提醒的系统通知（M4）。Windows 上走系统通知中心
tauri-plugin-notification = "2"
# 应用内更新：检查/下载/安装 + 重启。签名密钥在 %USERPROFILE%.tauriquick-note.key
# （构建时需 TAURI_SIGNING_PRIVATE_KEY_PATH 指向私钥；发版流程见记忆/发布文档）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"
# 附件是二进制（图片等），走 base64 比 JSON 数字数组小三倍左右、也快得多
base64 = "0.22"
# 同步用的 HTTP 客户端。阻塞式（不需要 async 运行时），TLS 走系统实现
# （Windows 上是 SChannel），因此不引入 ring 之类的 C 依赖，也不用装 OpenSSL。
ureq = { version = "3", default-features = false, features = ["native-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
