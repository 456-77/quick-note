[package]
name = "quick-note"
version = "0.21.0"
description = "Quick Note - 轻量 Markdown 笔记软件"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quick_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 定时提醒的系统通知（M4）。Windows 上走系统通知中心，Android 走系统通知（需权限）
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"
# 附件是二进制（图片等），走 base64 比 JSON 数字数组小三倍左右、也快得多
base64 = "0.22"
# 同步用的 HTTP 客户端。阻塞式（不需要 async 运行时）。

# ---- 桌面专属依赖 --------------------------------------------------------
# 注意：Cargo.toml 的 target 段不认识 tauri-build 注入的自定义 cfg(desktop)/cfg(mobile)，
# 必须用 target_os 布尔表达式；源码内部（net.rs/lib.rs）才可以用 cfg(desktop)/cfg(mobile)。

# 应用内更新：检查/下载/安装 + 重启。updater 插件不支持移动端（Android 由商店/侧载机制管）。
# 签名密钥在 %USERPROFILE%.tauriquick-note.key
# （构建时需 TAURI_SIGNING_PRIVATE_KEY_PATH 指向私钥；发版流程见记忆/发布文档）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# 全局快捷键（OS 级，应用不在前台也响应）：截图识别入口（0.20）。仅桌面。
tauri-plugin-global-shortcut = "2"
# TLS 走系统实现（Windows 上是 SChannel），因此不引入 ring 之类的 C 依赖，也不用装 OpenSSL。
# native-tls 没有 Android 后端，这里必须与移动端的 rustls 依赖互斥分层。
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# ---- 移动端依赖 ----------------------------------------------------------
# Android 上走纯 Rust 的 rustls + 捆绑的 Mozilla 根证书（WebPki）：Android 系统信任库
# 没有暴露在 rustls-native-certs 期望的标准路径上，WebPki 对 Let's Encrypt 等主流 CA 足够。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

# ---- Windows 专属依赖 ----------------------------------------------------
# 直接访问 WebView2 COM 接口（内存占用目标，最小化时自动释放缓存）。
# 版本跟随 tauri 主依赖树（0.20 加全局快捷键插件后 tauri 2.12 → webview2-com 0.39），
# 必须与 webview2-com-sys 所用的 windows-core 同版本，Interface::cast 才是同一个 trait。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "=0.62.2"
# 跨进程聚焦仓库窗口（open_vaults.rs）：枚举窗口、AttachThreadInput 前台切换、
# OpenProcess 探测登记表里 pid 的存活。版本与上面的 windows-core 一致（同一棵树）。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
